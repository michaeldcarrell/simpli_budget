{% extends "_layout.html" %}
{% block title %}Not found{% endblock %}
{% block body %}
<div class="page-narrow text-center py-5">
    <p class="num text-body-secondary mb-2" style="font-size: 13px; letter-spacing: 1.5px;">404</p>
    <h1 class="detail-title">{{ message|default:"Page not found" }}</h1>
    <p class="text-body-secondary mt-2">It may have been removed, or it belongs to a different group.</p>
    <a href="/budget" class="btn btn-primary mt-3">Back to the budget</a>
</div>
{% endblock %}

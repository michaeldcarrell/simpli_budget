services:
  simpli_budget:
    build: .
    container_name: simpli_budget
    restart: unless-stopped
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - CBA_LAMBDA_KEY=${CBA_LAMBDA_KEY}
      - PLAID_SECRET=${PLAID_SECRET}
      - CBA_POSTGRES_DB_PASS=${CBA_POSTGRES_DB_PASS}
      - CBA_POSTGRES_DB_HOST=${CBA_POSTGRES_DB_HOST}
      - CBA_POSTGRES_DB_USER=${CBA_POSTGRES_DB_USER}
      - DEMO_GROUP_ID=${DEMO_GROUP_ID:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHAT_GROUP_IDS=${CHAT_GROUP_IDS:-}
      - REFRESH_GROUP_IDS=${REFRESH_GROUP_IDS:-}
      - PTO_FUNDS=${PTO_FUNDS:-}
      - AIRFLOW_API_URL=${AIRFLOW_API_URL:-}
      - AIRFLOW_API_USERNAME=${AIRFLOW_API_USERNAME:-simpli_budget}
      - AIRFLOW_API_PASSWORD=${AIRFLOW_API_PASSWORD:-}
    ports:
      - "8003:8000"
    networks:
      - proxy

networks:
  proxy:
    external: true
